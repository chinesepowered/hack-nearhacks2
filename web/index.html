<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arf: one seal pup, raised by everyone</title>
<meta name="description" content="A memecoin on NEAR testnet that you can only earn by caring for, and amusing, one shared seal pup.">
<style>/*__FONTS__*/</style>
<style>/*__CSS__*/</style>
</head>
<body>
<div class="sky" aria-hidden="true">
  <div class="sun"></div>
  <div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>
  <div class="bergs"></div>
</div>

<header class="top">
  <a class="brand" href="#" aria-label="Arf">
    <span class="brand-mark" id="brandMark"></span>
    <span class="brand-text"><b>Arf</b><i>one seal pup, raised by everyone</i></span>
  </a>
  <div class="top-right">
    <span class="net" title="Everything here runs on NEAR testnet. Nothing has real value.">NEAR testnet</span>
    <div class="account" id="account"></div>
  </div>
</header>

<main>
  <section class="stage" aria-label="The pup">
    <aside class="panel vitals" id="vitals"></aside>

    <div class="floe-wrap">
      <div class="bubble" id="bubble" hidden></div>
      <div class="fx" id="fx"></div>
      <div class="pup" id="pup"></div>
      <div class="floe" aria-hidden="true"></div>
      <div class="ripples" aria-hidden="true"><i></i><i></i><i></i></div>
      <div class="gone" id="gone" hidden></div>
    </div>

    <aside class="panel actions" id="actions"></aside>
    <div class="sea" aria-hidden="true"><div class="wave w1"></div><div class="wave w2"></div></div>
  </section>

  <section class="grid">
    <article class="card wide verdict" id="verdictCard"></article>
    <article class="card" id="pantryCard"></article>
    <article class="card wide" id="jokesCard"></article>
    <article class="card" id="topCard"></article>
    <article class="card" id="colonyCard"></article>
    <article class="card" id="feedCard"></article>
    <article class="card" id="pastCard"></article>
    <article class="card full rules" id="rulesCard"></article>
  </section>
</main>

<footer class="foot" id="foot"></footer>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script>window.ARF_CONFIG = /*__CONFIG__*/null;</script>
<script>/*__JS__*/</script>
</body>
</html>
