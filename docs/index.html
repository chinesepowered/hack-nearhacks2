<style>:root {
  --ink: #1b2a4a;
  --ink-soft: #55678a;
  --line: #dfe8f5;
  --card: #ffffff;
  --coral: #ff6f61;
  --coral-dark: #e9574a;
  --sun: #ffc94d;
  --mint: #3fc8a0;
  --sky-1: #6f9bff;
  --sky-2: #a9c2ff;
  --sky-3: #ffd9e6;
  --sea-1: #5cb8e6;
  --sea-2: #2f7fc0;
  --ice: #f4faff;
  --radius: 22px;
  --shadow: 0 10px 30px rgba(28, 58, 120, .16);
  --display: 'Fredoka', 'Nunito', system-ui, sans-serif;
  --body: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
* { box-sizing: border-box; }
html { background: #2f7fc0; overflow-x: hidden; }
body {
  margin: 0; color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.45;
  background: linear-gradient(180deg, var(--sky-1) 0, var(--sky-2) 300px, var(--sky-3) 560px, var(--sea-1) 760px, var(--sea-2) 1100px, #235f9c 100%);
  min-height: 100vh; overflow-x: hidden;
}
h1, h2, h3, .num, button, .brand b { font-family: var(--display); }
h2 { font-size: 20px; margin: 0 0 12px; letter-spacing: .2px; display: flex; align-items: center; gap: 8px; }
h2 small { font: 600 13px var(--body); color: var(--ink-soft); margin-left: auto; }
a { color: #2b62d9; text-decoration: none; }
a:hover { text-decoration: underline; }
button { cursor: pointer; border: 0; font-size: 17px; font-weight: 600; }
button:disabled { cursor: not-allowed; filter: grayscale(.5); opacity: .6; }
.mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; }

/* ------------------------------------------------------------------ sky */
.sky { position: absolute; inset: 0 0 auto 0; height: 760px; pointer-events: none; overflow: hidden; }
.sun { position: absolute; left: 30%; top: 70px; width: 120px; height: 120px; border-radius: 50%;
  background: radial-gradient(circle, #fff7d6 0, #ffe08a 45%, rgba(255, 224, 138, 0) 72%); filter: blur(.3px); }
.cloud { position: absolute; height: 46px; border-radius: 40px; background: rgba(255, 255, 255, .78); filter: blur(1px); }
.cloud::before, .cloud::after { content: ''; position: absolute; background: inherit; border-radius: 50%; }
.cloud::before { width: 62px; height: 62px; left: 24px; top: -28px; }
.cloud::after { width: 84px; height: 84px; right: 26px; top: -42px; }
.c1 { width: 210px; left: 7%; top: 120px; animation: drift 70s linear infinite; }
.c2 { width: 160px; left: 58%; top: 64px; opacity: .8; animation: drift 95s linear infinite reverse; }
.c3 { width: 250px; left: 34%; top: 190px; opacity: .55; animation: drift 120s linear infinite; }
@keyframes drift { 0% { transform: translateX(-40px); } 50% { transform: translateX(60px); } 100% { transform: translateX(-40px); } }
.bergs { position: absolute; left: 0; right: 0; top: 452px; height: 150px; opacity: .9;
  background:
    linear-gradient(135deg, transparent 49.5%, #e6f2ff 50%) 25% 100% / 84px 110px no-repeat,
    linear-gradient(225deg, transparent 49.5%, #cfe4fb 50%) calc(25% + 84px) 100% / 84px 110px no-repeat,
    linear-gradient(135deg, transparent 49.5%, #f2f8ff 50%) 65% 100% / 60px 84px no-repeat,
    linear-gradient(225deg, transparent 49.5%, #d6e8fc 50%) calc(65% + 60px) 100% / 60px 84px no-repeat,
    linear-gradient(135deg, transparent 49.5%, #dcebfb 50%) 31% 100% / 46px 52px no-repeat,
    linear-gradient(225deg, transparent 49.5%, #c5dcf6 50%) calc(31% + 46px) 100% / 46px 52px no-repeat; }

/* ------------------------------------------------------------------ header */
.top { position: relative; z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 16px;
  max-width: 1480px; margin: 0 auto; padding: 18px 28px 0; }
.brand { display: flex; align-items: center; gap: 12px; color: #fff; text-decoration: none !important; }
.brand-mark { width: 54px; height: 54px; border-radius: 50%; background: #fff; box-shadow: var(--shadow); display: grid; place-items: center; overflow: hidden; }
.brand-mark svg { width: 46px; height: 46px; }
.brand-text b { display: block; font-size: 34px; line-height: 1; font-weight: 700; text-shadow: 0 2px 10px rgba(30, 60, 140, .35); }
.brand-text i { font-style: normal; font-weight: 700; font-size: 15px; opacity: .95; text-shadow: 0 1px 6px rgba(30, 60, 140, .35); }
.top-right { display: flex; align-items: center; gap: 12px; }
.net { font-weight: 800; font-size: 12.5px; letter-spacing: .6px; text-transform: uppercase; color: #fff; background: rgba(20, 50, 120, .28); padding: 7px 12px; border-radius: 99px; backdrop-filter: blur(4px); }
.account { display: flex; align-items: center; gap: 10px; }
.chip { display: flex; align-items: center; gap: 10px; background: #fff; border-radius: 99px; padding: 7px 14px 7px 8px; box-shadow: var(--shadow); font-weight: 700; font-size: 14.5px; }
.chip .avatar { width: 30px; height: 30px; border-radius: 50%; background: linear-gradient(135deg, #ffd27a, #ff8f7a); display: grid; place-items: center; color: #fff; font: 700 15px var(--display); }
.chip .bal { color: var(--ink-soft); font-weight: 700; }
.chip .bal b { color: var(--ink); font-family: var(--display); font-weight: 600; }
.btn { background: var(--coral); color: #fff; border-radius: 99px; padding: 12px 22px; box-shadow: 0 6px 0 var(--coral-dark), 0 12px 22px rgba(233, 87, 74, .35); transition: transform .08s, box-shadow .08s; }
.btn:hover:not(:disabled) { transform: translateY(-1px); }
.btn:active:not(:disabled) { transform: translateY(5px); box-shadow: 0 1px 0 var(--coral-dark), 0 4px 10px rgba(233, 87, 74, .3); }
.btn.ghost { background: #fff; color: var(--ink); box-shadow: 0 5px 0 #c9d7ee, 0 10px 18px rgba(28, 58, 120, .14); }

/* ------------------------------------------------------------------ stage */
main { position: relative; z-index: 2; max-width: 1480px; margin: 0 auto; padding: 0 28px 40px; }
.stage { position: relative; display: grid; grid-template-columns: 330px 1fr 380px; gap: 22px; align-items: end; min-height: 640px; padding-top: 22px; }
.panel { position: relative; z-index: 4; background: rgba(255, 255, 255, .93); backdrop-filter: blur(8px); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; align-self: center; }
.sea { position: absolute; left: 50%; width: 100vw; transform: translateX(-50%); bottom: -40px; height: 190px; z-index: 1; pointer-events: none; overflow: hidden; }
.wave { position: absolute; left: 0; right: 0; height: 60px; border-radius: 50%; opacity: .5; }
.w1 { top: 6px; background: radial-gradient(ellipse at 50% 100%, rgba(255, 255, 255, .0) 60%, rgba(255, 255, 255, .55) 61%, rgba(255, 255, 255, 0) 64%) 0 0 / 220px 60px repeat-x; animation: waves 9s linear infinite; }
.w2 { top: 52px; background: radial-gradient(ellipse at 50% 100%, rgba(255, 255, 255, .0) 60%, rgba(255, 255, 255, .4) 61%, rgba(255, 255, 255, 0) 64%) 60px 0 / 300px 60px repeat-x; animation: waves 14s linear infinite reverse; }
@keyframes waves { from { background-position-x: 0; } to { background-position-x: 600px; } }

.floe-wrap { position: relative; z-index: 3; height: 600px; display: flex; align-items: flex-end; justify-content: center; }
.floe { position: absolute; left: 50%; bottom: 34px; width: min(760px, 96%); height: 150px; transform: translateX(-50%);
  background: linear-gradient(180deg, #ffffff 0, #f1f8ff 46%, #cfe6fb 47%, #a9d0f2 100%);
  border-radius: 46% 54% 44% 56% / 62% 60% 40% 38%;
  box-shadow: 0 26px 30px rgba(20, 70, 130, .28), inset 0 -18px 0 rgba(120, 180, 230, .35);
  animation: bob 6s ease-in-out infinite; }
.floe::after { content: ''; position: absolute; left: 12%; right: 16%; top: 16px; height: 14px; border-radius: 50%; background: rgba(255, 255, 255, .9); filter: blur(2px); }
.pup { position: absolute; left: 50%; bottom: 118px; width: min(560px, 80%); transform: translateX(-50%); animation: bob 6s ease-in-out infinite; transition: opacity .3s; }
.pup.leaving { animation: dive 1.4s ease-in forwards; }
.pup.arriving { animation: surface 1.1s cubic-bezier(.2, 1.4, .4, 1) both, bob 6s ease-in-out 1.1s infinite; }
.pup.absent { opacity: 0; pointer-events: none; }
@keyframes bob { 0%, 100% { transform: translateX(-50%) translateY(0) rotate(-.6deg); } 50% { transform: translateX(-50%) translateY(7px) rotate(.6deg); } }
@keyframes dive { 0% { transform: translateX(-50%) translateY(0) rotate(0); opacity: 1; } 35% { transform: translateX(-36%) translateY(-34px) rotate(14deg); opacity: 1; } 100% { transform: translateX(10%) translateY(300px) rotate(58deg); opacity: 0; } }
@keyframes surface { 0% { transform: translateX(-50%) translateY(260px) scale(.7); opacity: 0; } 100% { transform: translateX(-50%) translateY(0) scale(1); opacity: 1; } }
.ripples { position: absolute; left: 50%; bottom: 8px; width: 820px; height: 60px; transform: translateX(-50%); }
.ripples i { position: absolute; left: 50%; top: 50%; width: 760px; height: 46px; border: 3px solid rgba(255, 255, 255, .55); border-radius: 50%; transform: translate(-50%, -50%) scale(.9); animation: ripple 5s ease-out infinite; }
.ripples i:nth-child(2) { animation-delay: 1.6s; }
.ripples i:nth-child(3) { animation-delay: 3.2s; }
@keyframes ripple { 0% { transform: translate(-50%, -50%) scale(.86); opacity: .9; } 100% { transform: translate(-50%, -50%) scale(1.22); opacity: 0; } }

.gone { position: absolute; left: 50%; bottom: 190px; transform: translateX(-50%); width: min(460px, 86%); text-align: center; background: rgba(255, 255, 255, .95); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px 22px; z-index: 6; }
.gone h3 { margin: 0 0 6px; font-size: 24px; }
.gone p { margin: 0 0 14px; color: var(--ink-soft); font-weight: 700; }

.bubble { position: absolute; left: 58%; bottom: 462px; max-width: 300px; z-index: 7; background: #fff; border-radius: 22px; padding: 13px 18px; font: 600 19px/1.3 var(--display); box-shadow: var(--shadow); transform-origin: 10% 100%; animation: pop .35s cubic-bezier(.2, 1.6, .4, 1) both; }
.bubble::after { content: ''; position: absolute; left: 30px; bottom: -13px; width: 26px; height: 26px; background: #fff; border-radius: 4px 4px 22px 4px; transform: rotate(18deg) skewX(-18deg); }
.bubble small { display: block; font: 800 12px var(--body); letter-spacing: .5px; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 2px; }
@keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }

.fx { position: absolute; inset: 0; z-index: 8; pointer-events: none; }
.fx .fish { position: absolute; width: 74px; left: 0; top: 0; animation: toss 1s cubic-bezier(.3, 0, .6, 1) forwards; }
@keyframes toss { 0% { transform: translate(var(--x0), var(--y0)) rotate(-30deg) scale(.6); opacity: 0; } 12% { opacity: 1; } 55% { transform: translate(calc((var(--x0) + var(--x1)) / 2), calc(var(--y1) - 190px)) rotate(120deg) scale(1.15); } 100% { transform: translate(var(--x1), var(--y1)) rotate(250deg) scale(.35); opacity: .2; } }
.fx .plus { position: absolute; left: 27%; bottom: 430px; transform: translateX(-50%); font: 700 40px var(--display); color: #fff; -webkit-text-stroke: 2px #e09a12; text-shadow: 0 4px 0 #e09a12, 0 8px 18px rgba(120, 80, 0, .4); white-space: nowrap; animation: rise 2.2s ease-out forwards; }
.fx .plus.burn { -webkit-text-stroke: 2px #c0392b; text-shadow: 0 4px 0 #c0392b, 0 8px 18px rgba(120, 20, 0, .4); }
@keyframes rise { 0% { transform: translate(-50%, 30px) scale(.5); opacity: 0; } 15% { transform: translate(-50%, 0) scale(1.1); opacity: 1; } 75% { opacity: 1; } 100% { transform: translate(-50%, -120px) scale(1); opacity: 0; } }
.fx .arf { position: absolute; font: 700 30px var(--display); color: #fff; -webkit-text-stroke: 1.5px #ff6f61; text-shadow: 0 3px 0 #ff6f61; animation: arf 1s ease-out forwards; }
@keyframes arf { 0% { transform: translate(0, 0) scale(.4) rotate(var(--r)); opacity: 0; } 20% { opacity: 1; } 100% { transform: translate(var(--dx), -90px) scale(1.2) rotate(var(--r)); opacity: 0; } }
.fx .splash { position: absolute; left: 50%; bottom: 60px; width: 14px; height: 14px; border-radius: 50%; background: #fff; animation: splash 1s ease-out forwards; }
@keyframes splash { 0% { transform: translate(0, 0) scale(1); opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) scale(.3); opacity: 0; } }
.fx .note { position: absolute; left: 44%; bottom: 430px; font: 700 34px var(--display); color: #fff; text-shadow: 0 2px 0 #7a8fd0; animation: arf 2.4s ease-out forwards; }

/* ------------------------------------------------------------------ vitals */
.vitals h3 { margin: 0; font-size: 26px; line-height: 1.1; }
.vitals .sub { color: var(--ink-soft); font-weight: 700; margin: 2px 0 14px; }
.meter { margin: 12px 0; }
.meter .row { display: flex; align-items: center; justify-content: space-between; font-weight: 800; margin-bottom: 6px; }
.meter .row span { display: flex; align-items: center; gap: 8px; }
.meter .row b { font: 600 19px var(--display); }
.meter svg { width: 24px; height: 24px; }
.bar { height: 18px; border-radius: 99px; background: #e6eefb; overflow: hidden; box-shadow: inset 0 2px 4px rgba(28, 58, 120, .12); }
.bar i { display: block; height: 100%; border-radius: 99px; width: 0; transition: width .9s linear, background-color .6s; }
.bar.belly i { background: linear-gradient(90deg, #35c997, #63e0b5); }
.bar.belly.warn i { background: linear-gradient(90deg, #ffb020, #ffd166); }
.bar.belly.danger i { background: linear-gradient(90deg, #ff5a4d, #ff8a7a); animation: pulse 1s ease-in-out infinite; }

@keyframes pulse { 50% { filter: brightness(1.25); } }
.count { margin-top: 14px; padding: 12px 14px; border-radius: 16px; background: #f1f6ff; font-weight: 700; color: var(--ink-soft); }
.count b { display: block; font: 600 27px var(--display); color: var(--ink); letter-spacing: .5px; }
.count.danger { background: #fff0ee; }
.count.danger b { color: #e2483b; }
.facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; text-align: center; }
.facts div { background: #f6f9ff; border-radius: 14px; padding: 8px 4px; font: 700 12px var(--body); color: var(--ink-soft); }
.facts b { display: block; font: 600 20px var(--display); color: var(--ink); }

/* ------------------------------------------------------------------ actions */
.actions h3 { margin: 0 0 4px; font-size: 20px; }
.actions .hint { margin: 0 0 12px; color: var(--ink-soft); font-weight: 700; font-size: 14.5px; }
.earn { margin: 10px 0 18px; text-align: center; font-weight: 800; color: var(--ink-soft); font-size: 14.5px; }

.theme { display: inline-flex; align-items: center; gap: 6px; background: #fff3d1; color: #8a5b00; border-radius: 99px; padding: 4px 11px; font: 800 13px var(--body); }
textarea { width: 100%; min-height: 92px; resize: none; border: 2px solid var(--line); border-radius: 16px; padding: 11px 13px; font: 600 16.5px/1.35 var(--body); color: var(--ink); outline: none; background: #fbfdff; }
textarea:focus { border-color: #8fb4ff; box-shadow: 0 0 0 4px rgba(111, 155, 255, .18); }
.jokebar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 10px; }
.jokebar .left { font: 700 13px var(--body); color: var(--ink-soft); }
.divider { height: 1px; background: var(--line); margin: 16px 0; }
.rowbtn { display: flex; gap: 10px; align-items: center; justify-content: space-between; }
.rowbtn p { margin: 0; font: 700 13.5px var(--body); color: var(--ink-soft); }

/* ------------------------------------------------------------------ cards */
.grid { position: relative; z-index: 4; display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; margin-top: 26px; }
.card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 22px; min-width: 0; }
.card.wide { grid-column: span 2; }
.card.full { grid-column: 1 / -1; }

.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.list li { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 14px; background: #f6f9ff; font-weight: 700; min-width: 0; }
.list li.me { background: #fff3d1; }
.list .rank { width: 26px; height: 26px; flex: none; border-radius: 50%; background: #dfe8f5; display: grid; place-items: center; font: 600 14px var(--display); }
.list li:nth-child(1) .rank { background: #ffd166; }
.list li:nth-child(2) .rank { background: #d9e2ee; }
.list li:nth-child(3) .rank { background: #f2c29b; }
.list .who { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list .val { font: 600 16px var(--display); white-space: nowrap; }
.tag { display: inline-block; font: 800 11.5px var(--body); letter-spacing: .4px; text-transform: uppercase; padding: 3px 9px; border-radius: 99px; background: #e6eefb; color: #456; }
.tag.ok { background: #d8f6ea; color: #14704f; }
.tag.no { background: #ffe1dd; color: #b03a2e; }
.tag.wait { background: #fff3d1; color: #8a5b00; }

.supply { display: flex; height: 22px; border-radius: 99px; overflow: hidden; background: #e6eefb; margin: 6px 0 12px; }
.supply i { display: block; height: 100%; transition: width .8s; }
.supply .p { background: linear-gradient(90deg, #6f9bff, #9ab9ff); }
.supply .c { background: linear-gradient(90deg, #35c997, #63e0b5); }
.supply .b { background: linear-gradient(90deg, #ff8a7a, #ff5a4d); }
.legend { display: grid; gap: 7px; }
.legend div { display: flex; justify-content: space-between; gap: 10px; font-weight: 700; }
.legend span { display: flex; align-items: center; gap: 8px; color: var(--ink-soft); }
.legend span::before { content: ''; width: 12px; height: 12px; border-radius: 4px; background: var(--c); }
.legend b { font: 600 16.5px var(--display); }

.joke { padding: 12px 14px; border-radius: 16px; background: #f6f9ff; display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; align-items: start; }
.joke + .joke { margin-top: 10px; }
.joke .score { grid-row: span 2; width: 58px; height: 58px; border-radius: 18px; display: grid; place-items: center; font: 700 26px var(--display); color: #fff; background: #9fb1cc; }
.joke .score.laugh { background: linear-gradient(135deg, #ffb020, #ff7a59); }
.joke .score.pending { background: #cfd9e8; font-size: 14px; }

.joke .meta { font: 700 13px var(--body); color: var(--ink-soft); display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
.joke .meta q { quotes: none; color: #7a4bc9; font-style: italic; }

/* verdict */
.verdict .vgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; align-items: start; }
.verdict .dial { display: flex; align-items: center; gap: 16px; margin-bottom: 10px; }
.verdict .big { width: 96px; height: 96px; flex: none; border-radius: 28px; display: flex; align-items: baseline; justify-content: center; padding-top: 14px; color: #fff; font: 700 46px var(--display); background: linear-gradient(135deg, #ffb020, #ff7a59); box-shadow: 0 8px 18px rgba(255, 122, 89, .35); }

.badge { display: inline-flex; align-items: center; gap: 7px; background: #d8f6ea; color: #0f6b4a; font: 800 13px var(--body); padding: 6px 12px; border-radius: 99px; }

.rules ol { margin: 0; padding-left: 22px; columns: 2; column-gap: 44px; font-weight: 600; }

.foot { position: relative; z-index: 4; max-width: 1480px; margin: 0 auto; padding: 6px 28px 36px; color: #eaf3ff; font-weight: 700; font-size: 14px; display: flex; flex-wrap: wrap; gap: 6px 18px; }

.toasts { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 50; display: grid; gap: 8px; justify-items: center; }

@media (max-width: 1180px) {

}
@media (prefers-reduced-motion: reduce) { * { animation-duration: .01s !important; animation-iteration-count: 1 !important; } }

.seal { --fur:#f7fbff; --fur-hi:#ffffff; --fur-lo:#cfdff0; --spot:#8fa3bd; overflow:visible; display:block; width:100%; height:auto; }
.seal[data-stage="1"] { --fur:#e9f0f7; --fur-hi:#fbfdff; --fur-lo:#b9cbe0; }
.seal[data-stage="2"] { --fur:#d3dee9; --fur-hi:#eef4f9; --fur-lo:#9fb4cb; }
.seal[data-stage="3"] { --fur:#b9c7d6; --fur-hi:#dbe5ee; --fur-lo:#8298b2; --spot:#5f738c; }
.seal .s-shadow { fill: rgba(30,70,130,.20); }
.seal .s-spots { opacity:0; }
.seal[data-stage="1"] .s-spots { opacity:.35; }
.seal[data-stage="2"] .s-spots { opacity:.7; }
.seal[data-stage="3"] .s-spots { opacity:1; }
.seal .s-blush { fill:#ff9db0; opacity:.55; }
.seal .s-eyes-happy, .seal .s-eyes-sleep, .seal .s-mouth-open, .seal .s-zzz, .seal .s-brows, .seal .s-tear, .seal .s-rumble { opacity:0; }
.seal .s-all { transform-origin: 225px 286px; animation: s-breathe 3.6s ease-in-out infinite; }
.seal .s-head { transform-origin: 190px 240px; }
.seal .s-eye { transform-origin: 190px 152px; animation: s-blink 4.6s infinite; }
.seal .s-tail { transform-origin: 356px 244px; animation: s-wag 2.8s ease-in-out infinite; }
.seal .s-flip-l { transform-origin: 156px 262px; }
.seal .s-flip-r { transform-origin: 234px 264px; }
.seal .s-mouth-open { transform-origin: 190px 204px; }

@keyframes s-breathe { 0%,100% { transform: scale(1,1); } 50% { transform: scale(1.012,1.028); } }
@keyframes s-blink { 0%,94%,100% { transform: scaleY(1); } 97% { transform: scaleY(.08); } }
@keyframes s-wag { 0%,100% { transform: rotate(0); } 50% { transform: rotate(-7deg); } }

/* hungry: big wet eyes, worried brows, rumbling tummy */
.seal.is-hungry .s-brows, .seal.is-hungry .s-rumble { opacity:1; }
.seal.is-hungry .s-rumble { animation: s-rumble .7s ease-in-out infinite; }
.seal.is-hungry .s-head { animation: s-droop 2.4s ease-in-out infinite; }
.seal.is-starving .s-tear { opacity:1; animation: s-tear 1.8s ease-in infinite; }
@keyframes s-rumble { 0%,100% { transform: translateX(0); } 50% { transform: translateX(5px); } }
@keyframes s-droop { 0%,100% { transform: rotate(0); } 50% { transform: rotate(-3deg) translateY(3px); } }
@keyframes s-tear { 0% { transform: translateY(0); opacity:1; } 100% { transform: translateY(26px); opacity:0; } }

/* happy */
.seal.is-happy .s-blush { opacity:.85; }
.seal.is-happy .s-tail { animation-duration: .9s; }

/* thinking: head tilt */
.seal.is-thinking .s-head { animation: s-tilt 1.6s ease-in-out infinite; }
@keyframes s-tilt { 0%,100% { transform: rotate(-7deg); } 50% { transform: rotate(7deg); } }

/* clapping and laughing */
.seal.is-clapping .s-eyes-open { opacity:0; }
.seal.is-clapping .s-eyes-happy, .seal.is-clapping .s-mouth-open { opacity:1; }
.seal.is-clapping .s-mouth { opacity:0; }
.seal.is-clapping .s-blush { opacity:1; }
.seal.is-clapping .s-all { animation: s-bounce .36s ease-in-out infinite; }
.seal.is-clapping .s-head { animation: s-laugh .36s ease-in-out infinite; }
.seal.is-clapping .s-flip-l { animation: s-clap-l .36s ease-in-out infinite; }
.seal.is-clapping .s-flip-r { animation: s-clap-r .36s ease-in-out infinite; }
.seal.is-clapping .s-tail { animation-duration: .36s; }
@keyframes s-bounce { 0%,100% { transform: translateY(0) scale(1,1); } 50% { transform: translateY(-12px) scale(1.02,1.03); } }
@keyframes s-laugh { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg) translateY(-4px); } }
@keyframes s-clap-l { 0%,100% { transform: rotate(0) translate(0,0); } 50% { transform: rotate(-64deg) translate(38px,-22px); } }
@keyframes s-clap-r { 0%,100% { transform: rotate(0) translate(0,0); } 50% { transform: rotate(64deg) translate(-38px,-22px); } }

/* munching */
.seal.is-munching .s-mouth { opacity:0; }
.seal.is-munching .s-mouth-open { opacity:1; animation: s-munch .28s ease-in-out infinite; }
.seal.is-munching .s-eyes-open { opacity:0; }
.seal.is-munching .s-eyes-happy { opacity:1; }
.seal.is-munching .s-head { animation: s-nod .28s ease-in-out infinite; }
@keyframes s-munch { 0%,100% { transform: scale(1,1); } 50% { transform: scale(.9,.25); } }
@keyframes s-nod { 0%,100% { transform: translateY(0); } 50% { transform: translateY(5px); } }

/* groan: unimpressed */
.seal.is-unimpressed .s-eyes-open { opacity:0; }
.seal.is-unimpressed .s-eyes-sleep { opacity:1; }
.seal.is-unimpressed .s-brows { opacity:1; }

/* asleep */
.seal.is-asleep .s-eyes-open { opacity:0; }
.seal.is-asleep .s-eyes-sleep { opacity:1; }
.seal.is-asleep .s-zzz { opacity:1; }
.seal.is-asleep .s-zzz text { animation: s-zzz 2.6s ease-in-out infinite; }
.seal.is-asleep .s-zzz text:nth-child(2) { animation-delay: .5s; }
.seal.is-asleep .s-zzz text:nth-child(3) { animation-delay: 1s; }
.seal.is-asleep .s-all { animation-duration: 5.5s; }
.seal.is-asleep .s-head { transform: rotate(-5deg) translateY(8px); }
@keyframes s-zzz { 0% { transform: translate(0,10px); opacity:0; } 30% { opacity:1; } 100% { transform: translate(14px,-22px); opacity:0; } }

@media (prefers-reduced-motion: reduce) { .seal * { animation: none !important; } }
