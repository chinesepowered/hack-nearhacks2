[package]
name = "arf"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Arf: one seal pup raised by everyone. A NEP-141 memecoin whose supply is released only by caring for, and amusing, a shared on-chain pet."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5.30.1", features = ["unstable"] }
near-contract-standards = "5.30.1"

[dev-dependencies]
near-sdk = { version = "5.30.1", features = ["unit-testing", "unstable"] }
ed25519-dalek = "2"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
